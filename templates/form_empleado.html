{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header">
                <h3>{{ titulo }}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   value="{{ empleado['nombre'] if empleado else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" 
                                   value="{{ empleado['apellido'] if empleado else '' }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cargo" class="form-label">Cargo</label>
                            <input type="text" class="form-control" id="cargo" name="cargo" 
                                   value="{{ empleado['cargo'] if empleado else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="salario" class="form-label">Salario</label>
                            <input type="number" step="0.01" class="form-control" id="salario" name="salario" 
                                   value="{{ empleado['salario'] if empleado else '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="departamento" class="form-label">Departamento</label>
                            <select class="form-select" id="departamento" name="departamento">
                                <option value="">Seleccione...</option>
                                <option value="Administración" {{ 'selected' if empleado and empleado['departamento'] == 'Administración' }}>Administración</option>
                                <option value="Recursos Humanos" {{ 'selected' if empleado and empleado['departamento'] == 'Recursos Humanos' }}>Recursos Humanos</option>
                                <option value="Tecnología" {{ 'selected' if empleado and empleado['departamento'] == 'Tecnología' }}>Tecnología</option>
                                <option value="Ventas" {{ 'selected' if empleado and empleado['departamento'] == 'Ventas' }}>Ventas</option>
                                <option value="Marketing" {{ 'selected' if empleado and empleado['departamento'] == 'Marketing' }}>Marketing</option>
                                <option value="Contabilidad" {{ 'selected' if empleado and empleado['departamento'] == 'Contabilidad' }}>Contabilidad</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fecha_ingreso" class="form-label">Fecha de Ingreso</label>
                            <input type="date" class="form-control" id="fecha_ingreso" name="fecha_ingreso" 
                                   value="{{ empleado['fecha_ingreso'] if empleado else '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" name="telefono" 
                                   value="{{ empleado['telefono'] if empleado else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" 
                                   value="{{ empleado['email'] if empleado else '' }}">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{{ url_for('lista_empleados') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

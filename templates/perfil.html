{% extends "base.html" %}
{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header">
                <h3>Mi Perfil</h3>
            </div>
            <div class="card-body">
                <table class="table">
                    <tr>
                        <th>ID:</th>
                        <td>{{ usuario['id'] }}</td>
                    </tr>
                    <tr>
                        <th>Usuario:</th>
                        <td>{{ usuario['username'] }}</td>
                    </tr>
                    <tr>
                        <th>Nombre Completo:</th>
                        <td>{{ usuario['nombre_completo'] }}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
